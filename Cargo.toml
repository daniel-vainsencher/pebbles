[package]
name = "pebbles"
version = "0.2.0"
edition = "2021"
authors = ["OpenHands <openhands@all-hands.dev>"]
description = "A rock-solid issue management tool built on top of Jujutsu (jj)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
colored = "2.1"
slug = "0.1"
fuzzy-matcher = "0.3"
ratatui = "0.29"
crossterm = "0.29"

[dev-dependencies]
trycmd = "0.15"
