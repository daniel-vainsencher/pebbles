[package]
name = "pebbles"
version = "1.0.0"
edition = "2021"
authors = ["Daniel Vainsencher <danielv@nirinor.ai>"]
description = "A rock-solid issue management tool built on top of Jujutsu (jj)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
colored = "2.1"
slug = "0.1"
rust-sugiyama = "0.4"
libc = "0.2"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
tui-tree-widget = "=0.24.1"

[dev-dependencies]
trycmd = "0.15"
tempfile = "3"
termlens = "=0.11.2"
